<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A minha biblioteca</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f4f3;--card:#fff;--ink:#14282b;--mute:#5d7074;--line:#d5dedd;--acc:#0f5c63;--accink:#fff;--warn:#b4432f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1c;--card:#172628;--ink:#e6efee;--mute:#93a9ac;--line:#2a3f42;--acc:#5cc3c9;--accink:#06292c;--warn:#f08a74;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a1c;--card:#172628;--ink:#e6efee;--mute:#93a9ac;--line:#2a3f42;--acc:#5cc3c9;--accink:#06292c;--warn:#f08a74;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:14px 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between}
h1{font:600 26px/1.1 Newsreader,Georgia,serif;margin:0}
.count{color:var(--mute);font-size:14px}
input,select,textarea,button{font:inherit;color:inherit}
.search{width:100%;margin-top:10px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chip{flex:none;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
main{padding:12px 16px 110px;max-width:640px;margin:0 auto}
.book{display:flex;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer}
.spine{flex:none;width:52px;height:76px;border-radius:3px 6px 6px 3px;display:flex;align-items:flex-end;padding:6px;font:600 18px Newsreader,Georgia,serif;color:#fff;box-shadow:inset 5px 0 0 rgba(0,0,0,.22)}
.cover{flex:none;width:52px;height:76px;border-radius:3px 6px 6px 3px;object-fit:cover;background:var(--line);box-shadow:inset 5px 0 0 rgba(0,0,0,.22)}
.info{min-width:0}
.t{font-weight:600;overflow-wrap:anywhere}
.a{color:var(--mute);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--mute)}
.tag.lent{color:var(--warn);border-color:var(--warn)}
.empty{text-align:center;color:var(--mute);padding:48px 16px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.btn{border:1px solid var(--line);background:var(--card);padding:12px 18px;border-radius:12px;cursor:pointer}
.btn.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.btn.d{color:var(--warn)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
dialog{width:min(520px,calc(100% - 20px));max-height:92vh;border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
.f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.row{display:flex;gap:8px}
.row .f{flex:1;min-width:0}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
video{width:100%;border-radius:10px;background:#000;margin-top:10px}
.msg{font-size:14px;color:var(--mute);margin:6px 0 0}
</style>
</head>
<body>
<header>
  <div class="top"><h1>A minha biblioteca</h1><span class="count" id="count"></span></div>
  <input class="search" id="q" type="search" placeholder="Pesquisar título, autor ou ISBN" aria-label="Pesquisar">
  <div class="chips" id="chips"></div>
</header>
<main id="list"></main>
<div class="fab">
  <button class="btn" id="bk">Cópia de segurança</button>
  <button class="btn p" id="add">Adicionar livro</button>
</div>

<dialog id="dlg">
  <h2 id="dt" style="margin:0 0 4px;font:600 22px Newsreader,Georgia,serif">Novo livro</h2>
  <label for="f-title">Título</label><input class="f" id="f-title">
  <label for="f-author">Autor</label><input class="f" id="f-author">
  <label for="f-publisher">Editora</label><input class="f" id="f-publisher">
  <label for="f-isbn">ISBN</label>
  <div class="row"><input class="f" id="f-isbn" inputmode="numeric"><button class="btn" id="scan" type="button">Ler código</button></div>
  <button class="btn" id="look" type="button" style="width:100%;margin-top:8px">Procurar título, autor, editora e capa</button>
  <p class="msg" id="lmsg" hidden></p>
  <img class="cover" id="prev" alt="Capa do livro" hidden style="margin-top:10px">
  <video id="vid" playsinline muted hidden></video>
  <p class="msg" id="smsg" hidden></p>
  <label for="f-shelf">Estante ou divisão</label><input class="f" id="f-shelf" list="shelves" placeholder="Ex.: Sala, Quarto">
  <datalist id="shelves"></datalist>
  <label for="f-status">Estado de leitura</label>
  <select class="f" id="f-status"><option>Por ler</option><option>A ler</option><option>Lido</option></select>
  <label for="f-lent">Emprestado a (deixe vazio se está em casa)</label><input class="f" id="f-lent">
  <label for="f-notes">Notas</label><textarea class="f" id="f-notes" rows="3"></textarea>
  <div class="acts">
    <button class="btn d" id="del" type="button">Apagar</button>
    <button class="btn" id="cancel" type="button">Cancelar</button>
    <button class="btn p" id="save" type="button">Guardar livro</button>
  </div>
</dialog>

<dialog id="bdlg">
  <h2 style="margin:0 0 4px;font:600 22px Newsreader,Georgia,serif">Cópia de segurança</h2>
  <p class="msg">Copie este texto e guarde-o numa nota. Para restaurar, cole-o aqui e escolha Restaurar.</p>
  <textarea class="f" id="bt" rows="8" style="margin-top:10px"></textarea>
  <p class="msg" id="bmsg"></p>
  <div class="acts">
    <button class="btn" id="bclose" type="button">Fechar</button>
    <button class="btn" id="bcopy" type="button">Copiar</button>
    <button class="btn p" id="brest" type="button">Restaurar</button>
  </div>
</dialog>

<script>
// Cole aqui o endereço do seu worker, entre aspas. Ex.: 'https://livros.o-seu-nome.workers.dev'
const WORKER='', KEY='biblioteca-v1', COLORS=['#0f5c63','#7a3b2e','#3d4f7c','#5b6b2f','#7b4b7a','#8a5a14','#2f6b4f','#8c3a52'];
let books=[], shelf='Todas', editing=null, curCover='';
const $=id=>document.getElementById(id);
function load(){try{const r=localStorage.getItem(KEY);books=r?JSON.parse(r):[]}catch(e){books=[]}if(!Array.isArray(books))books=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(books))}catch(e){}}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shelves(){return [...new Set(books.map(b=>b.shelf).filter(Boolean))].sort()}
function render(){
  const q=$('q').value.trim().toLowerCase();
  const sh=shelves();
  if(shelf!=='Todas'&&!sh.includes(shelf))shelf='Todas';
  $('chips').innerHTML=['Todas',...sh].map(s=>`<button class="chip" aria-pressed="${s===shelf}" data-s="${esc(s)}">${esc(s)}</button>`).join('');
  $('shelves').innerHTML=sh.map(s=>`<option value="${esc(s)}">`).join('');
  const out=books.filter(b=>(shelf==='Todas'||b.shelf===shelf)&&(!q||[b.title,b.author,b.publisher,b.isbn].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>a.title.localeCompare(b.title,'pt'));
  $('count').textContent=books.length+(books.length===1?' livro':' livros');
  $('list').innerHTML=out.length?out.map(b=>`<button class="book" data-id="${b.id}">
    ${b.cover?`<img class="cover" src="${esc(b.cover)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`:`<div class="spine" style="background:${COLORS[b.color%COLORS.length]}">${esc((b.title[0]||'?').toUpperCase())}</div>`}
    <div class="info"><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)||'Autor desconhecido'}</div>${b.publisher?`<div class="a">${esc(b.publisher)}</div>`:''}
    <div class="tags">${b.shelf?`<span class="tag">${esc(b.shelf)}</span>`:''}<span class="tag">${esc(b.status)}</span>${b.lent?`<span class="tag lent">Emprestado a ${esc(b.lent)}</span>`:''}</div></div></button>`).join('')
    :`<div class="empty">${books.length?'Nenhum livro encontrado.':'Ainda não tem livros. Toque em Adicionar livro para começar.'}</div>`;
}
function openForm(id){
  editing=books.find(b=>b.id===id)||null;
  const b=editing||{title:'',author:'',publisher:'',cover:'',isbn:'',shelf:shelf==='Todas'?'':shelf,status:'Por ler',lent:'',notes:''};
  $('dt').textContent=editing?'Editar livro':'Novo livro';
  for(const k of ['title','author','publisher','isbn','shelf','status','lent','notes'])$('f-'+k).value=b[k]||'';
  curCover=b.cover||'';setPrev();$('lmsg').hidden=true;
  $('del').hidden=!editing;stopScan();$('smsg').hidden=true;
  $('dlg').showModal();
}
function save(){
  const t=$('f-title').value.trim();
  if(!t){$('f-title').focus();return}
  const d={title:t};
  for(const k of ['author','publisher','isbn','shelf','status','lent','notes'])d[k]=$('f-'+k).value.trim();
  d.cover=curCover;
  if(editing)Object.assign(editing,d);
  else books.push({id:Date.now().toString(36),color:Math.floor(Math.random()*COLORS.length),...d});
  persist();stopScan();$('dlg').close();render();
}
let stream=null,timer=null;
function stopScan(){clearInterval(timer);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('vid').hidden=true}
async function scan(){
  const m=$('smsg');m.hidden=false;
  if(!('BarcodeDetector' in window)){m.textContent='Este navegador não lê códigos de barras. Escreva o ISBN, que está por baixo do código na contracapa.';return}
  try{
    const det=new BarcodeDetector({formats:['ean_13']});
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('vid');v.srcObject=stream;v.hidden=false;await v.play();
    m.textContent='Aponte a câmara ao código de barras da contracapa.';
    timer=setInterval(async()=>{
      try{const r=await det.detect(v);if(r.length){$('f-isbn').value=r[0].rawValue;stopScan();m.textContent='ISBN lido.';lookup()}}catch(e){}
    },400);
  }catch(e){stopScan();m.textContent='Não foi possível abrir a câmara. Autorize o acesso ou escreva o ISBN.'}
}
function setPrev(){const p=$('prev');p.hidden=!curCover;if(curCover)p.src=curCover}
$('prev').onerror=()=>{$('prev').hidden=true};
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw 0;return r.json()}
async function lookup(){
  const isbn=$('f-isbn').value.replace(/[^0-9Xx]/g,'');
  const m=$('lmsg');m.hidden=false;
  if(isbn.length<10){m.textContent='Escreva primeiro o ISBN (10 ou 13 dígitos).';return}
  m.textContent='A procurar…';
  let r=null;
  if(WORKER){try{const w=await getJSON(WORKER+'?isbn='+isbn);if(w&&w.title)r={title:w.title,author:w.author||'',publisher:w.publisher||'',cover:w.cover||''}}catch(e){}}
  if(!r)try{
    const g=await getJSON('https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn);
    const v=g.items&&g.items[0]&&g.items[0].volumeInfo;
    if(v)r={title:v.title+(v.subtitle?': '+v.subtitle:''),author:(v.authors||[]).join(', '),publisher:v.publisher||'',
      cover:v.imageLinks?(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail||'').replace('http://','https://'):''};
  }catch(e){}
  if(!r||!r.title){try{
    const o=await getJSON('https://openlibrary.org/api/books?bibkeys=ISBN:'+isbn+'&format=json&jscmd=data');
    const v=o['ISBN:'+isbn];
    if(v)r={title:v.title,author:(v.authors||[]).map(a=>a.name).join(', '),publisher:(v.publishers||[]).map(x=>x.name).join(', '),cover:v.cover?v.cover.medium:''};
  }catch(e){}}
  if(!r||!r.title){m.textContent='Não encontrei este ISBN, ou não há ligação à internet. Preencha à mão.';return}
  $('f-title').value=r.title;$('f-author').value=r.author;$('f-publisher').value=r.publisher;
  curCover=r.cover;setPrev();
  m.textContent='Dados preenchidos. Confirme antes de guardar.';
}
$('look').onclick=lookup;
$('add').onclick=()=>openForm();
$('save').onclick=save;
$('cancel').onclick=()=>{stopScan();$('dlg').close()};
$('dlg').addEventListener('close',stopScan);
$('scan').onclick=scan;
$('del').onclick=()=>{if(editing&&confirm('Apagar este livro?')){books=books.filter(b=>b!==editing);persist();$('dlg').close();render()}};
$('q').oninput=render;
$('chips').onclick=e=>{const c=e.target.closest('.chip');if(c){shelf=c.dataset.s;render()}};
$('list').onclick=e=>{const c=e.target.closest('.book');if(c)openForm(c.dataset.id)};
$('bk').onclick=()=>{$('bt').value=JSON.stringify(books);$('bmsg').textContent='';$('bdlg').showModal()};
$('bclose').onclick=()=>$('bdlg').close();
$('bcopy').onclick=async()=>{try{await navigator.clipboard.writeText($('bt').value);$('bmsg').textContent='Copiado.'}catch(e){$('bt').select();$('bmsg').textContent='Selecione o texto e copie manualmente.'}};
$('brest').onclick=()=>{
  try{const d=JSON.parse($('bt').value);
    if(!Array.isArray(d)||d.some(b=>!b||typeof b.title!=='string'))throw 0;
    if(!confirm('Isto substitui os '+books.length+' livros atuais por '+d.length+'. Continuar?'))return;
    books=d.map((b,i)=>({color:i,id:Date.now().toString(36)+i,author:'',isbn:'',shelf:'',status:'Por ler',lent:'',notes:'',...b}));
    persist();render();$('bdlg').close();
  }catch(e){$('bmsg').textContent='O texto não é uma cópia de segurança válida.'}
};
load();render();
</script>
</body>
</html>
